        tag: baseline_with_references
        runs: [exp_fig_2_updated_run_1_slim, exp_fig_2_updated_run_2_slim, exp_fig_2_updated_run_3_slim]
      - label: "GPT-4.1-mini + Memory (no-spec training)"
        source: gpt
        model: gpt-4.1-mini
        tag: baseline_with_memory_no_spec
        runs: [exp_fig_2_updated_run_1_slim, exp_fig_2_updated_run_2_slim, exp_fig_2_updated_run_3_slim]
      - label: "GPT-4.1-mini + Memory (spec-trained)"
        source: gpt
        model: gpt-4.1-mini
        tag: baseline_mem_spec_trained
        runs: [exp_fig_2_updated_run_1_slim, exp_fig_2_updated_run_2_slim, exp_fig_2_updated_run_3_slim]
      - label: "GPT-4.1-mini + Memory (spec-trained) + FHIR Specs"
        source: gpt
        model: gpt-4.1-mini
        tag: baseline_with_memory_and_references
        runs: [exp_fig_2_updated_run_1_slim, exp_fig_2_updated_run_2_slim, exp_fig_2_updated_run_3_slim]
      - label: "Claude Sonnet 4.6 Baseline (Claude Code)"
        source: claude_code
        model: claude-sonnet-4.6
        tag: claude_code
        runs: [exp_fig_2_claude_code_run_1_slim, exp_fig_2_claude_code_run_2_slim, exp_fig_2_claude_code_run_3_slim]

  - id: exp3
    name: "Experiment 3: 43 tasks, 3 variations, paraphrased"
    description: "Same as Experiment 2, but task descriptions are paraphrased (GPT-4.1) during training and evaluation."
    configs:
      - label: "GPT-4.1-mini Baseline (LangChain OpenAI)"
        source: gpt
        model: gpt-4.1-mini
        tag: baseline_nomemory
        runs: [exp_fig_3_updated_run_1_slim, exp_fig_3_updated_run_4_slim, exp_fig_3_updated_run_5_slim]
      - label: "GPT-4.1-mini + FHIR Specs"
        source: gpt
        model: gpt-4.1-mini
        tag: baseline_with_references
        runs: [exp_fig_3_updated_run_1_slim, exp_fig_3_updated_run_4_slim, exp_fig_3_updated_run_5_slim]
      - label: "GPT-4.1-mini + Memory (no-spec training)"
        source: gpt
        model: gpt-4.1-mini
        tag: baseline_with_memory_no_spec
        runs: [exp_fig_3_updated_run_1_slim, exp_fig_3_updated_run_4_slim, exp_fig_3_updated_run_5_slim]
      - label: "GPT-4.1-mini + Memory (spec-trained)"
        source: gpt
        model: gpt-4.1-mini
        tag: baseline_mem_spec_trained
        runs: [exp_fig_3_updated_run_1_slim, exp_fig_3_updated_run_4_slim, exp_fig_3_updated_run_5_slim]
      - label: "GPT-4.1-mini + Memory (spec-trained) + FHIR Specs"
        source: gpt
        model: gpt-4.1-mini
        tag: baseline_with_memory_and_references
        runs: [exp_fig_3_updated_run_1_slim, exp_fig_3_updated_run_4_slim, exp_fig_3_updated_run_5_slim]
      - label: "Claude Sonnet 4.6 Baseline (Claude Code)"
        source: claude_code
        model: claude-sonnet-4.6
        tag: claude_code
        runs: [exp_fig_3_claude_code_run_1_slim, exp_fig_3_claude_code_run_2_slim, exp_fig_3_claude_code_run_3_slim]

  - id: exp4
    name: "Experiment 4: 22 held-out tasks, 3 variations, paraphrased"
    description: "Train on two variations of 21 tasks; evaluate on three variations of the remaining 22 held-out tasks, with paraphrasing."
    configs:
      - label: "GPT-4.1-mini Baseline (LangChain OpenAI)"
        source: gpt
        model: gpt-4.1-mini
        tag: baseline_nomemory
        runs: [exp_fig_4_updated_run_1_slim, exp_fig_4_updated_run_2_slim, exp_fig_4_updated_run_3_slim]
      - label: "GPT-4.1-mini + FHIR Specs"
        source: gpt
        model: gpt-4.1-mini
        tag: baseline_with_references
        runs: [exp_fig_4_updated_run_1_slim, exp_fig_4_updated_run_2_slim, exp_fig_4_updated_run_3_slim]
      - label: "GPT-4.1-mini + Memory (no-spec training)"
        source: gpt
        model: gpt-4.1-mini
        tag: baseline_with_memory_no_spec
        runs: [exp_fig_4_updated_run_1_slim, exp_fig_4_updated_run_2_slim, exp_fig_4_updated_run_3_slim]
      - label: "GPT-4.1-mini + Memory (spec-trained)"
        source: gpt
