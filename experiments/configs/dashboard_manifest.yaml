        model: gpt-4.1-mini
        tag: baseline_nomemory
        runs: [exp_fig_2_updated_run_1_slim, exp_fig_2_updated_run_2_slim, exp_fig_2_updated_run_3_slim]
      - label: "GPT-4.1-mini + FHIR Specs"
        source: gpt
