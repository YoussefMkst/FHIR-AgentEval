# Dashboard manifest — declares which result dirs form each experiment/config,
# across legacy (flat, grouped by agent_tag) and new (nested) result layouts.
#
# Structure:
#   experiments[].id / name / description
#   experiments[].configs[]:
#     label   — human-readable name shown in the dashboard
#     source  — gpt | claude_code | openrouter
#     model   — underlying model id
#     tag     — agent_tag used to filter records inside a run dir (legacy flat
#               dirs mix several tags; nested dirs contain a single tag)
#     runs    — list of run dirs (relative to results/) contributing to this config
#
# Paths are relative to the results/ directory.
#
# Coverage: legacy GPT (5 configs) + claude_code (1) exist for Exp1-4.
# The 6 OpenRouter baseline models exist for Exp1 only.

experiments:
  - id: exp1
    name: "Experiment 1: 43 tasks, 1 variation"
    description: "Train Reflexion on one variation per task; evaluate on the same variations."
    configs:
      # --- Legacy GPT baselines (LangChain OpenAI, gpt-4.1-mini) ---
      - label: "GPT-4.1-mini Baseline (LangChain OpenAI)"
        source: gpt
        model: gpt-4.1-mini
        tag: baseline_nomemory
        runs: [exp_fig_1_updated_run_1_slim, exp_fig_1_updated_run_2_slim, exp_fig_1_updated_run_3_slim]
      - label: "GPT-4.1-mini + FHIR Specs"
        source: gpt
        model: gpt-4.1-mini
        tag: baseline_with_references
        runs: [exp_fig_1_updated_run_1_slim, exp_fig_1_updated_run_2_slim, exp_fig_1_updated_run_3_slim]
      - label: "GPT-4.1-mini + Memory (no-spec training)"
        source: gpt
        model: gpt-4.1-mini
        tag: baseline_with_memory_no_spec
        runs: [exp_fig_1_updated_run_1_slim, exp_fig_1_updated_run_2_slim, exp_fig_1_updated_run_3_slim]
      - label: "GPT-4.1-mini + Memory (spec-trained)"
        source: gpt
        model: gpt-4.1-mini
        tag: baseline_mem_spec_trained
        runs: [exp_fig_1_updated_run_1_slim, exp_fig_1_updated_run_2_slim, exp_fig_1_updated_run_3_slim]
      - label: "GPT-4.1-mini + Memory (spec-trained) + FHIR Specs"
        source: gpt
        model: gpt-4.1-mini
        tag: baseline_with_memory_and_references
        runs: [exp_fig_1_updated_run_1_slim, exp_fig_1_updated_run_2_slim, exp_fig_1_updated_run_3_slim]

      # --- Legacy Claude Code baseline ---
      - label: "Claude Sonnet 4.6 Baseline (Claude Code)"
        source: claude_code
        model: claude-sonnet-4.6
        tag: claude_code
        runs: [exp_fig_1_claude_code_run_1_slim, exp_fig_1_claude_code_run_2_slim, exp_fig_1_claude_code_run_3_slim]

      # --- New OpenRouter baseline models (nested layout) ---
      - label: "GPT-OSS-120B Baseline (OpenRouter)"
        source: openrouter
        model: openai/gpt-oss-120b
        tag: gpt_oss_120b_baseline
        runs: [exp_openrouter_baseline_6models/gpt_oss_120b_baseline/run_1, exp_openrouter_baseline_6models/gpt_oss_120b_baseline/run_2, exp_openrouter_baseline_6models/gpt_oss_120b_baseline/run_3]
      - label: "Qwen3-32B Baseline (OpenRouter)"
        source: openrouter
        model: qwen/qwen3-32b
        tag: qwen3_32b_baseline
        runs: [exp_openrouter_baseline_6models/qwen3_32b_baseline/run_1, exp_openrouter_baseline_6models/qwen3_32b_baseline/run_2, exp_openrouter_baseline_6models/qwen3_32b_baseline/run_3]
      - label: "GPT-4.1-mini Baseline (OpenRouter)"
        source: openrouter
        model: openai/gpt-4.1-mini
        tag: gpt41mini_baseline
        runs: [exp_openrouter_baseline_6models/gpt41mini_baseline/run_1, exp_openrouter_baseline_6models/gpt41mini_baseline/run_2, exp_openrouter_baseline_6models/gpt41mini_baseline/run_3]
      - label: "DeepSeek V4 Flash Baseline (OpenRouter)"
        source: openrouter
        model: deepseek/deepseek-v4-flash
        tag: deepseek_v4_flash_baseline
        runs: [exp_openrouter_baseline_6models/deepseek_v4_flash_baseline/run_1, exp_openrouter_baseline_6models/deepseek_v4_flash_baseline/run_2, exp_openrouter_baseline_6models/deepseek_v4_flash_baseline/run_3]
      - label: "Claude Sonnet 4.6 Baseline (OpenRouter)"
        source: openrouter
        model: anthropic/claude-sonnet-4.6
        tag: claude_sonnet_46_baseline
        runs: [exp_openrouter_baseline_6models/claude_sonnet_46_baseline/run_1, exp_openrouter_baseline_6models/claude_sonnet_46_baseline/run_2, exp_openrouter_baseline_6models/claude_sonnet_46_baseline/run_3]
      - label: "GLM 5.2 Baseline (OpenRouter)"
        source: openrouter
        model: z-ai/glm-5.2
        tag: glm_52_baseline
        runs: [exp_openrouter_baseline_6models/glm_52_baseline/run_1, exp_openrouter_baseline_6models/glm_52_baseline/run_2, exp_openrouter_baseline_6models/glm_52_baseline/run_3]

  - id: exp2
    name: "Experiment 2: 43 tasks, 3 unseen variations"
    description: "Train on two variations per task; evaluate on three unseen variations per task."
    configs:
      - label: "GPT-4.1-mini Baseline (LangChain OpenAI)"
